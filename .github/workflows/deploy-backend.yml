name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend in EC2
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
            set -e

            cd /home/ubuntu/backend/aeropuerto-backend

            echo "Actualizando repositorio..."
            git pull origin main

            echo "Compilando backend..."
            ./mvnw clean package -DskipTests

            echo "Reiniciando servicio..."
            sudo -n /usr/bin/systemctl restart aeropuerto-backend

            echo "Esperando arranque del backend..."

            BACKEND_OK=0

            for i in {1..60}; do
              if curl -fsS http://localhost:8080/catalogos/status > /dev/null 2>&1; then
                BACKEND_OK=1
                break
              fi

              echo "Intento $i: backend aún no disponible..."
              sleep 2
            done

            if [ "$BACKEND_OK" -ne 1 ]; then
              echo "ERROR: El backend no levantó a tiempo."
              sudo journalctl -u aeropuerto-backend -n 150 --no-pager
              exit 1
            fi

            echo "Backend levantado correctamente."
            echo "Deploy completado correctamente."
          EOF